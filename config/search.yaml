# Settings for the literature watch (scripts/search.py)
# Edit this file to change the scope; the weekly watch reads it again at every run.

# Contact address sent to OpenAlex ("polite pool").
# Leave it empty in a public repository if you prefer, and use the CONTACT_EMAIL secret instead.
contact_email: ""

# Start date if no watch has run yet (YYYY-MM-DD).
# Afterwards, each run starts from the date of the previous successful run (data/candidates/state.json).
default_since: "2026-10-01"

# Maximum number of results kept per query or per followed paper.
max_per_query: 25

# OpenAlex work types kept (article, review, book-chapter, preprint, dissertation, report…).
types: [article, review, book-chapter, preprint, dissertation, report]

# 1) Queries on OpenAlex, matched against titles and abstracts only.
#    Double quotes = exact phrase; words side by side must all appear (AND); OR and NOT are allowed.
queries:
  - '"acid rock drainage" AND (glacier OR glacial OR proglacial)'
  - '"acid rock drainage" AND permafrost'
  - '"rock glacier" AND (sulfate OR sulphate OR acid OR metals)'
  - '"natural acid rock drainage"'
  - '"acid drainage" AND (proglacial OR deglaciated OR deglaciation)'
  - '("sulfide oxidation" OR "pyrite oxidation") AND (glacier OR permafrost OR alpine)'
  - '"rock glacier" AND (nickel OR "trace elements")'
  - '"permafrost thaw" AND (acidification OR metals OR "rusting")'
  - '"Cordillera Blanca" AND ("water quality" OR metals OR acid)'
  - '("Rio Santa" OR "Río Santa" OR Ancash OR Áncash) AND (acid OR metals) AND glacier'
  - '(Pyrenees OR Pyrenean OR Pirineos) AND ("acid drainage" OR "acid rock drainage" OR sulfate OR metals)'
  - 'ferricrete AND (mountain OR alpine OR Pyrenees)'
  - '"drenaje ácido" AND (glaciar OR roca)'
  - '"drenaje ácido" AND ("Cordillera Blanca" OR Ancash OR Áncash)'
  - '"drainage rocheux acide" OR "drainage minier acide"'
  - '(proglacial OR deglaciated) AND soil AND (acid OR pyrite OR sulfide)'
  - '("acid rock drainage" OR "acid drainage") AND (vegetation OR plants OR wetland OR bofedal)'
  - '("acid rock drainage" OR "acid drainage" OR "soil acidification") AND "functional traits"'

# 2) Followed papers: the watch looks for new works that cite them (corpus keys).
follow_citations_of:
  - Zarroca2021
  - Santofimia2017
  - Fortner2011
  - Magnusson2020
  - Garcia2025
  - BravoZevallos2024
  - Zimmer2023c
  - GuijosaOrtega2025
  - Guerra2026
  - Williams2005
  - Thies2007
  - Colombo2017
  - Wanner2023
  - Brighenti2024
  - ODonnell2024
  - Manning2024

# 3) Semantic Scholar recommendations based on the followed papers (optional; a free key helps).
semantic_scholar_recommendations: true

# Minimum score for a candidate to appear in the report (see README, "Literature watch").
min_score: 2
