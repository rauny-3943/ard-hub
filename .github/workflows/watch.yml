# Weekly literature watch: finds new publications that are not in the corpus, saves them in data/candidates/
# and refreshes the "New candidates" page. To screen them, edit data/candidates/to_screen.csv on GitHub
# (decision column = keep / reject): the "Integrate screening" workflow does the rest.
name: Literature watch

on:
  schedule:
    - cron: "17 6 * * 1"   # Monday 06:17 UTC
  workflow_dispatch:
    inputs:
      since:
        description: "Start date YYYY-MM-DD (empty = since the last run)"
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: corpus-data
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: search
        name: Query OpenAlex and Semantic Scholar
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          SINCE: ${{ inputs.since }}
        run: |
          if [ -n "$SINCE" ]; then
            python scripts/search.py --since "$SINCE"
          else
            python scripts/search.py
          fi
      - name: Save the candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidates/
          git commit -m "Literature watch ${{ steps.search.outputs.date }}: ${{ steps.search.outputs.new }} new candidates" || echo "Nothing new"
          git pull --rebase
          git push
      - name: Refresh the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
