# Rebuilds the map, the reading table and the .bib, checks that they match, then publishes to GitHub Pages.
name: Publish the map

on:
  push:
    branches: [main]
    paths: ["data/**", "templates/**", "scripts/**", "tests/**", "requirements.txt", ".github/workflows/publish.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build map, table and BibLaTeX
        run: python scripts/build.py
      - name: Check that the deliverables match
        run: python -m pytest -q tests
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
