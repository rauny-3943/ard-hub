# Runs when you edit data/candidates/to_screen.csv on GitHub: adds the "keep" rows to the corpus,
# files the "reject" rows so they never come back, checks everything and refreshes the website.
name: Integrate screening

on:
  push:
    branches: [main]
    paths: ["data/candidates/to_screen.csv"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: corpus-data
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Apply the screening decisions
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: python scripts/integrate.py
      - name: Check the corpus
        run: |
          python scripts/build.py
          python -m pytest -q tests
      - name: Save the corpus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Add screened papers to the corpus" || echo "Nothing to integrate"
          git pull --rebase
          git push
      - name: Refresh the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
