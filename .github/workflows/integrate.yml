# When you edit data/candidates/to_screen.csv on a watch branch (from the pull request), this adds the "keep"
# rows to the corpus, files the "reject" rows, rebuilds, and pushes to the same branch.
name: Integrate screening

on:
  push:
    branches: ["watch/**"]
    paths: ["data/candidates/to_screen.csv"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Apply the screening decisions
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: python scripts/integrate.py
      - run: python scripts/build.py
      - run: python -m pytest -q tests
      - name: Push to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Integrate literature watch screening" || echo "Nothing to integrate"
          git push
